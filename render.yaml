# Optional Render Blueprint for a NEW service. For an existing live Tesoria
# service, apply the equivalent settings in its Dashboard instead of creating
# another Blueprint. Never paste secrets into this file.
services:
  - type: web
    name: tesoria
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        value: https://tesoria.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Tesoria
